dsql_version: "2026.09"

# Statements Aurora DSQL rejects. Each rule names a libpg_query statement node
# (snake_case oneof name) and optional predicates that must all match.
# Reference: https://docs.aws.amazon.com/aurora-dsql/latest/userguide/working-with-postgresql-compatibility-unsupported-features.html
unsupported:
  - id: truncate
    stmt: truncate_stmt
    code: "0A000"
    message: "unsupported statement: Truncate"

  - id: extensions
    stmt: create_extension_stmt
    code: "0A000"
    message: "unsupported statement: CreateExtension"

  - id: triggers
    stmt: create_trig_stmt
    code: "0A000"
    message: "CREATE TRIGGER not supported"

  - id: create_database
    stmt: createdb_stmt
    code: "0A000"
    message: "unsupported statement: Createdb"

  - id: temporary_table
    stmt: create_stmt
    relpersistence: ["t"]
    code: "0A000"
    message: "TEMPORARY or TEMP table not supported for CREATE TABLE"

  - id: unlogged_table
    stmt: create_stmt
    relpersistence: ["u"]
    code: "0A000"
    message: "UNLOGGED table not supported for CREATE TABLE"

  - id: serial
    stmt: create_stmt
    column_type: &serial_types ["serial", "bigserial", "smallserial"]
    code: "42704"
    message: 'type "serial" does not exist'

  # A type is unsupported wherever a column declares it, so ALTER TABLE ADD
  # COLUMN and ALTER COLUMN TYPE are checked against the same lists. The
  # anchors keep the two forms from drifting apart.
  - id: serial_alter_column
    stmt: alter_table_stmt
    column_type: *serial_types
    code: "42704"
    message: 'type "serial" does not exist'

  - id: identity_cache
    stmt: create_stmt
    identity_cache_min: 65536
    cache_allow: [1]
    code: "0A000"
    message: "identity column is not supported without an explicit cache size. please define CACHE greater than or equal to 65536 or equal to 1"

  # Reported in issue #2: only a bigint identity column is accepted, and the
  # refusal names the type that was written. This follows the cache rule, which
  # answers an identity column that has no CACHE at all.
  - id: identity_type
    stmt: create_stmt
    identity_type_not: ["int8"]
    code: "0A000"
    message: "datatype {type} not supported, identity column type must be bigint"

  # ALTER TABLE ADD COLUMN is restricted the same way, seen twice against the
  # cluster (2026-09-18) before either run was discarded for unrelated reasons.
  - id: identity_type_alter_column
    stmt: alter_table_stmt
    identity_type_not: ["int8"]
    code: "0A000"
    message: "datatype {type} not supported, identity column type must be bigint"

  # Data types are an allow-list in the documentation: anything absent from the
  # supported-types page is unsupported. This deny-list covers the tested set.
  - id: unsupported_type
    stmt: create_stmt
    column_type: &unsupported_types
      ["money", "xml", "inet", "cidr", "macaddr", "macaddr8", "point", "line",
       "lseg", "box", "path", "polygon", "circle", "tsvector", "tsquery",
       "int4range", "int8range", "numrange", "tsrange", "tstzrange", "daterange",
       "bit", "varbit", "pg_lsn"]
    code: "0A000"
    message: "datatype {type} not supported"

  # Recorded on 2026-09-16: DSQL refuses the ALTER COLUMN ... TYPE form itself,
  # whatever the target type. Its message names no type, where the ADD COLUMN
  # refusal names one ("datatype money not supported"), so this is a statement
  # restriction rather than a type one. It is ordered before the type rules so
  # that it, not they, answers a retype to an unsupported type.
  - id: alter_column_type
    stmt: alter_table_stmt
    alter_action: ["AT_AlterColumnType"]
    code: "0A000"
    message: "unsupported ALTER TABLE ALTER COLUMN ... SET DATA TYPE statement"

  - id: unsupported_type_alter_column
    stmt: alter_table_stmt
    column_type: *unsupported_types
    code: "0A000"
    message: "datatype {type} not supported"

  # An array is just another unsupported datatype to DSQL, named as PostgreSQL
  # displays it: an int[] column is refused as "datatype integer[] not supported".
  - id: array_column
    stmt: create_stmt
    column_array: true
    code: "0A000"
    message: "datatype {type} not supported"

  - id: array_column_alter_column
    stmt: alter_table_stmt
    column_array: true
    code: "0A000"
    message: "datatype {type} not supported"

  # No user-defined types exist, so every statement that would touch one is
  # refused: CREATE TYPE, ALTER TYPE, and DROP TYPE.
  - id: alter_enum
    stmt: alter_enum_stmt
    code: "0A000"
    message: "ALTER TYPE not supported"

  - id: rename_type
    stmt: rename_stmt
    rename_type: ["OBJECT_TYPE"]
    code: "0A000"
    message: "unsupported object in RENAME statement"

  - id: drop_type
    stmt: drop_stmt
    remove_type: ["OBJECT_TYPE"]
    code: "0A000"
    message: "unsupported object in DROP statement"

  # Full-text search and geometric functions rely on types DSQL does not have.
  # Text search fails as a missing configuration; the geometric types are
  # reported as unsupported datatypes.
  - id: unsupported_text_search
    stmt: select_stmt
    function:
      ["to_tsvector", "to_tsquery", "plainto_tsquery", "phraseto_tsquery",
       "websearch_to_tsquery", "ts_rank", "ts_headline", "setweight"]
    code: "42704"
    message: 'text search configuration "english" does not exist'

  - id: unsupported_geometry
    stmt: select_stmt
    function: ["line", "circle", "polygon", "box", "path", "lseg", "center", "radius"]
    code: "0A000"
    message: "datatype {type} not supported"

  # DSQL detects conflicts at commit for FOR UPDATE and FOR KEY SHARE, but does
  # not offer FOR SHARE or FOR NO KEY UPDATE.
  - id: unsupported_locking
    stmt: select_stmt
    locking: ["LCS_FORSHARE", "LCS_FORNOKEYUPDATE"]
    code: "0A000"
    message: "locking clauses other than FOR UPDATE/FOR KEY SHARE are not supported"

  - id: materialized_view
    stmt: create_table_as_stmt
    objtype: ["OBJECT_MATVIEW"]
    code: "0A000"
    message: "unsupported statement: CreateTableAs"

  - id: create_table_as
    stmt: create_table_as_stmt
    objtype: ["OBJECT_TABLE"]
    code: "0A000"
    message: "unsupported statement: CreateTableAs"

  - id: enum_type
    stmt: create_enum_stmt
    code: "0A000"
    message: "CREATE TYPE not supported"

  - id: composite_type
    stmt: composite_type_stmt
    code: "0A000"
    message: "unsupported statement: CompositeType"

  - id: range_type
    stmt: create_range_stmt
    code: "0A000"
    message: "unsupported statement: CreateRange"

  - id: sequence_cache
    stmt: create_seq_stmt
    sequence_cache_min: 65536
    cache_allow: [1]
    code: "0A000"
    message: "CREATE SEQUENCE is not supported without an explicit cache size. please define CACHE greater than or equal to 65536 or equal to 1"

  - id: tablespace
    stmt: create_table_space_stmt
    code: "0A000"
    message: "unsupported statement: CreateTableSpace"

  - id: foreign_table
    stmt: create_foreign_table_stmt
    code: "0A000"
    message: "unsupported statement: CreateForeignTable"

  - id: vacuum
    stmt: vacuum_stmt
    vacuum_kind: ["VACUUM"]
    code: "0A000"
    message: "unsupported VACUUM statement"

  - id: tablesample
    stmt: select_stmt
    contains: ["RangeTableSample"]
    code: "0A000"
    message: "TABLESAMPLE clause not supported"

  # Aurora DSQL requires NOT VALID on a CHECK or FOREIGN KEY added by ALTER
  # TABLE, and validates it through the ASYNC form.
  - id: alter_add_constraint_requires_not_valid
    stmt: alter_table_stmt
    add_constraint_missing_not_valid: true
    code: "0A000"
    message: "unsupported ALTER TABLE ADD CONSTRAINT statement"

  # Reported in issue #3: a key constraint cannot be added to a table that
  # exists. The USING INDEX form is left alone, because the recorded
  # alter_unique_using_index probe shows DSQL accepting the statement and
  # complaining about the index instead.
  - id: alter_add_key_constraint
    stmt: alter_table_stmt
    add_constraint_type: ["CONSTR_PRIMARY", "CONSTR_UNIQUE"]
    code: "0A000"
    message: "unsupported ALTER TABLE ADD CONSTRAINT statement"

  - id: alter_validate_requires_async
    stmt: alter_table_stmt
    alter_action: ["AT_ValidateConstraint"]
    unless_async: true
    code: "0A000"
    message: "unsupported ALTER TABLE VALIDATE CONSTRAINT statement"

  - id: merge
    stmt: merge_stmt
    code: "0A000"
    message: "unsupported statement type: MERGE"

  - id: show_lc_collate
    stmt: variable_show_stmt
    show_name: ["lc_collate"]
    code: "42704"
    message: 'unrecognized configuration parameter "lc_collate"' 

  - id: listen
    stmt: listen_stmt
    code: "0A000"
    message: "unsupported statement: Listen"

  - id: notify
    stmt: notify_stmt
    code: "0A000"
    message: "unsupported statement: Notify"

  - id: unlisten
    stmt: unlisten_stmt
    code: "0A000"
    message: "unsupported statement: Unlisten"

  - id: alter_system
    stmt: alter_system_stmt
    code: "0A000"
    message: "unsupported statement: AlterSystem"

  - id: set_transaction
    stmt: variable_set_stmt
    set_name: ["TRANSACTION", "SESSION CHARACTERISTICS"]
    code: "0A000"
    message: 'setting configuration parameter "TRANSACTION" not supported'

  - id: set_isolation
    stmt: variable_set_stmt
    set_name: ["transaction_isolation", "default_transaction_isolation"]
    code: "0A000"
    message: 'setting configuration parameter "default_transaction_isolation" not supported'

  - id: sync_index
    stmt: index_stmt
    unless_async: true
    code: "0A000"
    message: "unsupported mode. please use CREATE INDEX ASYNC."

  - id: savepoint
    stmt: transaction_stmt
    txn_kind: ["TRANS_STMT_SAVEPOINT"]
    code: "0A000"
    message: "unsupported transaction statement: SAVEPOINT"

  - id: release_savepoint
    stmt: transaction_stmt
    txn_kind: ["TRANS_STMT_RELEASE"]
    code: "0A000"
    message: "unsupported transaction statement: RELEASE"

  - id: rollback_to_savepoint
    stmt: transaction_stmt
    txn_kind: ["TRANS_STMT_ROLLBACK_TO"]
    code: "0A000"
    message: "unsupported transaction statement: ROLLBACK TO"

  - id: create_function_language
    stmt: create_function_stmt
    language_not: ["sql"]
    code: "0A000"
    message: "CREATE FUNCTION with language {language} not supported"

isolation:
  supported: ["repeatable read"]

limits:
  dml_rows_per_txn: 3000
  txn_age_seconds: 1800

occ:
  # What DSQL treats as a conflict. The emulator does not read these: the
  # backing engine's row-lock modes already draw the same lines, and a refused
  # lock is what the adjudicator acts on. They record what is being emulated.
  sources: ["write_write", "select_for_update", "select_for_key_share", "fk_key_share"]
  key_columns_only_for: ["fk_key_share"]
  error: "change conflicts with another transaction (OC000)"
  sqlstate: "40001"
  # PostgreSQL waits for a row lock where DSQL adjudicates at commit. Bounding
  # the wait turns it into the evidence of a conflict, which the emulator then
  # reports at COMMIT the way DSQL does, without the wait.
  lock_timeout_ms: 50
  inject: []
