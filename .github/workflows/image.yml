name: image

# Publishes to GHCR. Called directly by the release workflow, and also triggered
# by a release created by hand in the UI. A release created with the default
# GITHUB_TOKEN does not emit an event that other workflows see, which is why the
# release workflow calls this rather than relying on `release: published`.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Version tag to build, for example v1.2.3
        required: true
        type: string
      latest:
        description: Also tag the image as latest
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tags to publish
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "latest=${{ inputs.latest }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "latest=${{ !github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # GHCR requires a lowercase path.
          images: ghcr.io/dreamescaper/dsql-emulator
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # GitHub runners are amd64; build both so Apple Silicon can pull it.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
